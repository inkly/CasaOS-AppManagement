name: goreleaser

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish AppManagement packages
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install upx (post-build hooks in .goreleaser.yaml)
        run: |
          set -euo pipefail
          sudo apt-get update || true
          sudo apt-get install --no-install-recommends --yes upx

      - name: Generate APIs and run tests
        run: |
          set -euo pipefail
          go generate ./...
          go test ./...

      # .goreleaser.yaml has no "version:" key (v1 format); GoReleaser v2 rejects such configs.
      - name: Build and publish with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
